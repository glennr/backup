# The local repository is vega's disk, reached over SFTP. LOCAL_REPO is the path as vega's SSH
# server sees it: the kopia-sftp account is chrooted to /mnt/kopia, so /mnt/kopia/repo is /repo.
# LOCAL_HOST must resolve through /etc/hosts. kopia resolves names itself and does not use mDNS,
# so vega.local fails here even though `getent hosts vega.local` answers.
LOCAL_REPO=/repo
LOCAL_HOST=vega
LOCAL_USER=kopia-sftp
