
B2_BUCKET=roberts-kopia-backups
B2_BUCKET_ID=1f5c2f2945248b1faf070b18
B2_ENDPOINT=s3.us-west-004.backblazeb2.com
B2_REGION=us-west-004

B2_RETENTION_MODE=COMPLIANCE
B2_RETENTION_PERIOD=30d

KOPIA_VERSION=0.23.1

SOURCES=(
  /home
  /etc
)

VERIFY_PERCENT=5

MAX_SNAPSHOT_AGE_HOURS=26

# Hosts that no longer snapshot. Their data stays restorable and still counts
# toward the shrink check; only the freshness check skips them.
RETIRED_HOSTS=(mia)

CACHE_DIR=/var/cache/kopia

# Optional second repository on a local disk: absolute path to a directory whose parent is a
# mountpoint; empty means B2 only. Every job (snapshot, verify, check) then writes or reads both
# repositories, same sources and policies, and fails if either is unavailable. `REPO=local kb ...`
LOCAL_REPO=
